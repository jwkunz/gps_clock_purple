[package]
name = "gps_clock_purple"
version = "0.1.0"
authors = ["jwkunz <jake.kunzler@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "gps_clock_purple"
test = false
bench = false

[dependencies]
panic-halt = "1.0.0"
embedded-hal = "1.0"
heapless = "0.9.3"
avr-device = "0.8.1"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2"
features = ["arduino-nano"]

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
